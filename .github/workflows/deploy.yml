# Cloudflare Workers Deployment Workflow
# This workflow builds and deploys your project to Cloudflare Workers

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'vite.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'wrangler.toml'
  workflow_dispatch:
  schedule:
    - cron: '0 4 */20 * *'

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          
      - name: Install project dependencies with pnpm via npm
        run: |
          npm install -g pnpm@10.5.0 || true
     
      - name: Refresh Instagram token for this build
        env:
          PUBLIC_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.PUBLIC_INSTAGRAM_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const current = (process.env.PUBLIC_INSTAGRAM_ACCESS_TOKEN || '').trim();
          const githubEnv = process.env.GITHUB_ENV;

          async function main() {
            if (!githubEnv) {
              throw new Error('GITHUB_ENV is not available');
            }

            if (!current) {
              fs.appendFileSync(githubEnv, 'PUBLIC_INSTAGRAM_ACCESS_TOKEN=\n');
              console.log('PUBLIC_INSTAGRAM_ACCESS_TOKEN is empty. Build will continue without Instagram feed.');
              return;
            }

            try {
              const url = new URL('https://graph.instagram.com/refresh_access_token');
              url.searchParams.set('grant_type', 'ig_refresh_token');
              url.searchParams.set('access_token', current);

              const response = await fetch(url);
              const data = await response.json().catch(() => ({}));
              const refreshed = (data?.access_token || '').trim();

              if (!response.ok || !refreshed) {
                const err = data?.error?.message || 'Invalid refresh response';
                throw new Error(err);
              }

              fs.appendFileSync(githubEnv, 'PUBLIC_INSTAGRAM_ACCESS_TOKEN=' + refreshed + '\n');
              console.log('Instagram token refreshed for this build.');
            } catch (error) {
              fs.appendFileSync(githubEnv, 'PUBLIC_INSTAGRAM_ACCESS_TOKEN=' + current + '\n');
              console.log('Instagram token refresh failed. Using existing token for this build. ' + error.message);
            }
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
     
      - name: Build project
        run: pnpm run build
    
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
